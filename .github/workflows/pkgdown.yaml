# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::chromote, local::.
          needs: website

      - name: Verify website dependencies
        run: |
          required <- c("pkgdown", "rmarkdown", "knitr", "htmlwidgets", "htmltools", "crosstalk")
          optional_spatial <- c("sf", "geojsonsf")
          packages <- c(required, optional_spatial)

          available <- vapply(packages, requireNamespace, logical(1), quietly = TRUE)
          missing_required <- required[!available[required]]
          if (length(missing_required) > 0) {
            stop(
              "Missing required website dependencies: ",
              paste(missing_required, collapse = ", "),
              call. = FALSE
            )
          }

          for (package in packages[available]) {
            cat(package, as.character(utils::packageVersion(package)), "\n")
          }

          missing_spatial <- optional_spatial[!available[optional_spatial]]
          if (length(missing_spatial) > 0) {
            cat(
              "PKGDOWN_SF_OPTIONAL_SKIP: GitHub Actions website environment missing ",
              paste(missing_spatial, collapse = ", "),
              "\n",
              sep = ""
            )
          }
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Validate generated pkgdown site
        run: Rscript tools/validate-pkgdown-site.R --mode ci

      - name: Locate Chrome for chromote (pkgdown visual)
        shell: bash
        run: |
          set -euo pipefail
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "${candidate}" >/dev/null 2>&1; then
              chrome_path="$(command -v "${candidate}")"
              echo "CHROMOTE_CHROME=${chrome_path}" >> "${GITHUB_ENV}"
              "${chrome_path}" --version
              exit 0
            fi
          done
          echo "No Chrome/Chromium found; pkgdown visual capture will be skipped"
          # Non-fatal: test will skip via skip_browser_visual_smoke() if Chrome unavailable

      - name: Run pkgdown visual capture
        env:
          NOT_CRAN: "true"
          GG2D3_BROWSER_VISUAL_SMOKE: "true"
          GG2D3_BROWSER_VISUAL_CI: "true"
        shell: bash
        run: |
          Rscript --vanilla -e '
            tryCatch({
              pkgload::load_all(quiet = TRUE)
              res <- testthat::test_file("tests/testthat/test-pkgdown-visual.R")
              df <- as.data.frame(res)
              if (any(df$failed > 0) || any(df$error)) quit(status = 1)
            }, error = function(e) { message("FATAL: ", conditionMessage(e)); quit(status = 1) })
          '

      - name: Upload pkgdown visual artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pkgdown-visual-${{ github.run_id }}
          path: test_output/pkgdown-visual/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload pkgdown site artifact
        uses: actions/upload-artifact@v6
        with:
          name: pkgdown-site-${{ github.run_id }}
          path: docs/
          if-no-files-found: error
          retention-days: 14

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: true
          branch: gh-pages
          folder: docs
