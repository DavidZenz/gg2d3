on:
  pull_request:
  workflow_dispatch:

name: browser-visual-smoke.yaml

permissions: read-all

jobs:
  browser-visual-smoke:
    runs-on: ubuntu-latest
    env:
      NOT_CRAN: "true"
      GG2D3_BROWSER_VISUAL_SMOKE: "true"
      GG2D3_BROWSER_VISUAL_CI: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check

      - name: Locate Chrome for chromote
        shell: bash
        run: |
          set -euo pipefail
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "${candidate}" >/dev/null 2>&1; then
              chrome_path="$(command -v "${candidate}")"
              echo "CHROMOTE_CHROME=${chrome_path}" >> "${GITHUB_ENV}"
              "${chrome_path}" --version
              exit 0
            fi
          done
          echo "No Chrome/Chromium executable found for chromote"
          exit 1

      - name: Run browser visual smoke
        shell: bash
        run: |
          Rscript --vanilla -e 'pkgload::load_all(quiet=TRUE); res <- testthat::test_file("tests/testthat/test-browser-visual-smoke.R"); df <- as.data.frame(res); if (any(df$failed > 0 | df$error)) quit(status = 1)'

      - name: Upload browser visual smoke artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-visual-smoke-${{ github.run_id }}
          path: test_output/browser-visual-smoke/
          if-no-files-found: warn
          retention-days: 14
